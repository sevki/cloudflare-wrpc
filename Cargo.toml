[workspace]
resolver = "2"
members = [
    "crates/wrpc-transport-do",
    "worker",
    "examples/pingpong"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sevki/cloudflare-wrpc"

[workspace.dependencies]
# Cloudflare Workers (from crates.io)
worker = "0.7"
worker-macros = "0.7"
worker-sys = "0.7"

# Async
futures = { version = "0.3", default-features = false }
futures-util = { version = "0.3", default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = { version = "1", default-features = false, features = ["std"] }
thiserror = "2"

# Bytes
bytes = { version = "1", features = ["serde"] }

# Logging
tracing = { version = "0.1", default-features = false }

# WebAssembly
wasm-bindgen = "=0.2.105"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "Headers",
    "Request",
    "RequestInit",
    "Response",
    "ResponseInit",
    "ReadableStream",
    "WritableStream",
] }

# Async runtime (minimal for wasm)
tokio = { version = "1", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

[profile.release.package."*"]
opt-level = "z"
codegen-units = 1

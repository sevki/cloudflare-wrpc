name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install worker-build
        run: cargo install worker-build

      - name: Build
        run: worker-build --release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: worker-build
          path: build/
          retention-days: 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: worker-build
          path: build/

      - name: Start wrangler dev and run tests
        run: |
          # Start wrangler dev in background with local mode
          pnpm dlx wrangler dev --local &
          WRANGLER_PID=$!

          # Wait for wrangler to start
          echo "Waiting for wrangler to start..."
          for i in {1..60}; do
            if curl -s http://127.0.0.1:8787/health > /dev/null 2>&1; then
              echo "Wrangler is ready!"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "Timeout waiting for wrangler"
              kill $WRANGLER_PID 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done

          # Run the e2e tests
          node tests/e2e.mjs
          TEST_EXIT_CODE=$?

          # Stop wrangler
          kill $WRANGLER_PID 2>/dev/null || true

          exit $TEST_EXIT_CODE
        timeout-minutes: 10

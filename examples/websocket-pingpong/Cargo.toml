[package]
name = "websocket-pingpong-worker"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.7"
worker-macros = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.105"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
futures-util = "0.3"
wrpc-transport-do = { path = "../../crates/wrpc-transport-do" }
